<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">同一三角形积分区域的纵向和横向切片</title>
  <desc id="description">区域满足零到一的 x 和 x 到一的 y。左图固定 x 后沿 y 积分；右图固定 y 后沿 x 积分。</desc>
  <rect width="1200" height="675" rx="32" fill="#f5f8fb"/>
  <text x="65" y="88" fill="#182839" font-size="42" font-weight="700" font-family="Arial, PingFang SC, sans-serif">改变积分次序：先画出同一个区域</text>
  <text x="67" y="131" fill="#52677a" font-size="24" font-family="Arial, PingFang SC, sans-serif">D = { (x, y) | 0 ≤ x ≤ 1, x ≤ y ≤ 1 }</text>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="65" y="175" width="510" height="430" rx="22" fill="#fff" stroke="#d7e0e9" stroke-width="2"/>
    <rect x="625" y="175" width="510" height="430" rx="22" fill="#fff" stroke="#d7e0e9" stroke-width="2"/>
    <text x="100" y="224" fill="#9d2866" font-size="28" font-weight="700">纵向切片 · 固定 x</text>
    <text x="660" y="224" fill="#007e8a" font-size="28" font-weight="700">横向切片 · 固定 y</text>
    <g stroke="#8194a6" stroke-width="3" fill="none">
      <path d="M145 532V262 M145 532H495"/><path d="M705 532V262 M705 532H1055"/>
    </g>
    <g fill="#ceeef0" stroke="#298e9a" stroke-width="2.5">
      <path d="M145 532V267H480Z"/><path d="M705 532V267H1040Z"/>
    </g>
    <path d="M330 386V267" stroke="#c23b7c" stroke-width="9" stroke-linecap="round"/>
    <path d="M705 355H930" stroke="#008c9a" stroke-width="9" stroke-linecap="round"/>
    <g fill="#52677a" font-size="20">
      <text x="131" y="558">0</text><text x="475" y="558">1</text><text x="119" y="273">1</text><text x="493" y="543">x</text><text x="127" y="253">y</text>
      <text x="691" y="558">0</text><text x="1035" y="558">1</text><text x="679" y="273">1</text><text x="1053" y="543">x</text><text x="687" y="253">y</text>
      <text x="285" y="591">y 从 x 到 1</text><text x="835" y="591">x 从 0 到 y</text>
    </g>
    <g fill="#182839" font-size="21">
      <text x="236" y="497">y = x</text><text x="796" y="497">y = x</text>
    </g>
  </g>
</svg>
